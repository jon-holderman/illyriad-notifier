[project]
name = "illyriad-notifier"
version = "0.1.0"
description = "A self-hosted Illyriad notification inbox and ntfy relay."
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.116,<1", "uvicorn>=0.35,<1", "httpx>=0.28,<1",
  "jinja2>=3.1.6,<4", "python-multipart>=0.0.20,<1",
  "cryptography>=45,<47", "pwdlib[argon2]>=0.2,<1", "itsdangerous>=2.2,<3",
]
[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.12,<1", "pyright>=1.1.403,<2"]
[project.scripts]
illyriad-notifier = "illyriad_notifier.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/illyriad_notifier"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
target-version = "py313"
line-length = 88
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.pyright]
include = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
